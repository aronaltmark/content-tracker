appId: com.garethnunns.content-tracker
productName: Content Tracker
artifactName: Content-Tracker-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - out/**
  - package.json
beforePack: scripts/before-pack.cjs
afterPack: scripts/after-pack.cjs
# ffprobe is run as a program, so it can't stay inside the archive
asarUnpack:
  - node_modules/@generativenoise/ffprobe-*/**
mac:
  target: dmg
  category: public.app-category.productivity
  # it lives in the menu bar, with no Dock icon
  extendInfo:
    LSUIElement: true
  # signed ad hoc, all of it: unsigned, or with only the linker's signature on the
  # program, a downloaded copy is "damaged" with no way to open it. Ad hoc, it's
  # unverified, which Privacy & Security's Open Anyway opens
  identity: '-'
  # the hardened runtime is for notarising, and ad hoc it can stop the app opening
  hardenedRuntime: false
# the app and Applications side by side, in the middle of the window: the default puts
# them low, below newer macOS's taller toolbar
dmg:
  # its own, from build/dmg-background.svg by npm run icons, with the arrow between them
  background: build/background.tiff
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 145
    - x: 400
      y: 145
      type: link
      path: /Applications
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  # its own name, as the package's has an @ and a / that can't be in a file's
  executableName: content-tracker
  category: Utility
  # x64, as the others are named and the updater looks for, where an AppImage's own name is
  # x86_64: only x64 is built for Linux
  artifactName: Content-Tracker-${version}-linux-x64.${ext}
publish: null
