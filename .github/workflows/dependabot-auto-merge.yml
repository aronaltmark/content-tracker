name: Merge Dependabot's updates
on: pull_request
permissions:
  contents: read
jobs:
  merge:
    # only Dependabot's own PRs
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: update
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Minor and patch updates to the packages merge once the checks pass. A major one waits
      # for a person, as do the actions': this token isn't allowed to change the workflows.
      - if: steps.update.outputs.package-ecosystem == 'npm_and_yarn' && steps.update.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
