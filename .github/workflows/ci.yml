name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - if: runner.os != 'Linux'
        run: npm run check
      # Linux has no screen or keyring of its own on GitHub's runners: the app's tests need
      # both, the keyring as they check sign ins survive the app being opened again
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb gnome-keyring dbus-x11
          dbus-run-session -- sh -c 'echo "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null && xvfb-run -a npm run check'
        env:
          ELECTRON_DISABLE_SANDBOX: 1
          # how Electron knows there's a keyring to keep sign ins in, rather than plain text
          XDG_CURRENT_DESKTOP: GNOME
