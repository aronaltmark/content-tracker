name: Publish the ffprobe packages
# the @generativenoise/ffprobe-* packages, made by scripts/ffprobe-packages.mjs from its
# pinned builds: run by hand once the pins change, never by a Content Tracker release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      # each build checked against its pinned sha256 before it's packaged
      - run: node scripts/ffprobe-packages.mjs
      # no token: npm's trusted publishing, set up on each package, takes GitHub's word for it.
      # A version that's already there is left as it is
      - name: Publish
        run: |
          for folder in packages/ffprobe/*/; do
            name=$(node -p "require('./$folder/package.json').name")
            version=$(node -p "require('./$folder/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              (cd "$folder" && npm publish --provenance --access public)
            fi
          done
